[package]
name = "raventech-osint-desktop"
version = "5.0.0-rc5"
description = "Portable local status shell for RavenTech OSINT"
authors = ["RavenTech"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
